version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: cron
      cronjob: 10 7 17 * *
      timezone: Europe/Paris
    rebase-strategy: disabled
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - bun
    commit-message:
      prefix: deps
      include: scope
    cooldown:
      default-days: 7
    groups:
      bun-security:
        applies-to: security-updates
        patterns:
          - '*'
      bun-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: 20 7 17 * *
      timezone: Europe/Paris
    rebase-strategy: disabled
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 7
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'
      github-actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: cron
      cronjob: 30 7 17 * *
      timezone: Europe/Paris
    rebase-strategy: disabled
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: docker
      include: scope
    cooldown:
      default-days: 7
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - '*'
      docker-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: cron
      cronjob: 40 7 17 * *
      timezone: Europe/Paris
    rebase-strategy: disabled
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: docker
      include: scope
    cooldown:
      default-days: 7
    groups:
      docker-compose-security:
        applies-to: security-updates
        patterns:
          - '*'
      docker-compose-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
